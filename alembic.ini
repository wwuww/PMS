# Alembic migration config (Sprint 15: end dev schema drift)
# Usage:
#   alembic revision --autogenerate -m "desc"   # generate incremental migration after model change
#   alembic upgrade head                        # apply migrations
#   alembic stamp head                          # register version on an already-aligned legacy DB
# Note: ASCII only in this file (Windows configparser decodes with system locale).
[alembic]
script_location = migrations
prepend_sys_path = .
# DB URL is read at runtime from PMS_DATABASE_URL (see migrations/env.py)
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
