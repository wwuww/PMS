[project]
name = "pms"
version = "0.1.0"
description = "PMS 酒店管理系统 - 云原生 SaaS（Sprint 1: 平台底座 + 房态状态机引擎）"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "auth: 跳过测试态鉴权旁路，用于验证鉴权本身（401/403）",
    "perf: 性能基线/压测（造规模数据，耗时较长；默认不进 CI，需显式 -m perf）",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
